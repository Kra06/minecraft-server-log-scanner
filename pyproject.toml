[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mclogscan"
version = "1.0.0"
description = "A security scanner that detects attacks in Minecraft server logs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mclogscan = "mclogscan.cli:main"

[tool.setuptools]
packages = ["mclogscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
